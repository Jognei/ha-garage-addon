name: Add-on images
# Runs the tests (tests.yaml), then builds the add-on for each architecture and, on main, publishes
# ghcr.io/<owner>/<arch>-parts-catalog:<version> (the `image:` in parts_catalog/config.yaml), so Home Assistant
# downloads a ready image instead of building.
on:
  push:
    branches: [main]
    paths: ["parts_catalog/**", ".github/workflows/build.yaml", ".github/workflows/tests.yaml"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  test:
    uses: ./.github/workflows/tests.yaml
  image:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          echo "version=$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\}/\1/p' parts_catalog/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/${{ matrix.arch }}-parts-catalog" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Refuse to overwrite a published version
        if: github.event_name != 'pull_request'
        env:
          TAG: ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
        run: |
          if out=$(docker manifest inspect "$TAG" 2>&1); then
            echo "::error::$TAG is already published. Raise version: in parts_catalog/config.yaml so this build doesn't overwrite it."
            exit 1
          fi
          # only a registry that answers "no such tag" lets the build go on; a failed lookup proves nothing
          if ! grep -qiE "no such manifest|manifest unknown" <<< "$out"; then
            echo "::error::Couldn't check the registry for $TAG, so the build stops: $out"
            exit 1
          fi
      - uses: docker/build-push-action@v6
        with:
          context: parts_catalog
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.v.outputs.image }}:${{ steps.v.outputs.version }}
            ${{ steps.v.outputs.image }}:latest
          labels: |
            io.hass.type=addon
            io.hass.name=Parts Catalog
            io.hass.arch=${{ matrix.arch }}
            io.hass.version=${{ steps.v.outputs.version }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Garage tracker add-on for Home Assistant
            org.opencontainers.image.licenses=MIT
