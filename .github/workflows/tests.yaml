name: Tests
# build.yaml runs these before it builds the image (pull requests, and pushes to main that change the add-on or these workflows).
on:
  push:
    branches-ignore: [main]
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r parts_catalog/requirements.txt
      - run: cd parts_catalog && python -m unittest discover tests -v
      - run: for f in parts_catalog/static/*.js; do node --check "$f"; done
